<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בלש האיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: one app column; home = player card + letter-pair board + three game cards. Each game is a single centered column. */
:root {
  --bg: #F3EEE6; --surface: #FFFFFF; --surface-2: #F8F4EE; --ink: #2A2238; --muted: #6B6278; --line: #E2D9CC;
  --plum: #7A3FD1; --coral: #E8573F; --sun: #F6B323; --teal: #138D84; --good: #1E9154; --bad: #D3333B;
  --white: #FFFFFF;
  --u: #E9E2D7; --m1: #F7C8BF; --m2: #FCD989; --m3: #CFE69B; --m4: #84D3A5;
  --shadow: 0 3px 0 rgba(42,34,56,.12);
  --display: "Varela Round", "Rubik", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17131F; --surface: #221C2D; --surface-2: #2A2337; --ink: #F1ECF7; --muted: #ABA1BA; --line: #3A3149;
  --plum: #A983F0; --coral: #FF7A63; --sun: #FFC448; --teal: #36C2B6; --good: #46C985; --bad: #FF6B72;
  --u: #2F283B; --m1: #6A3036; --m2: #6E561E; --m3: #4A6A2B; --m4: #23785A;
  --shadow: 0 3px 0 rgba(0,0,0,.4); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #17131F; --surface: #221C2D; --surface-2: #2A2337; --ink: #F1ECF7; --muted: #ABA1BA; --line: #3A3149;
  --plum: #A983F0; --coral: #FF7A63; --sun: #FFC448; --teal: #36C2B6; --good: #46C985; --bad: #FF6B72;
  --u: #2F283B; --m1: #6A3036; --m2: #6E561E; --m3: #4A6A2B; --m4: #23785A;
  --shadow: 0 3px 0 rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
[hidden] { display: none !important; }

.app { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 26px; background: none; border: 0; padding: 0; }
.brand svg { width: 42px; height: 42px; }
.top-r { display: flex; gap: 8px; align-items: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding-block: 5px; padding-inline: 5px 12px; font-weight: 700; font-size: 14px; }
.chip-btn.icon { padding: 7px 12px; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--white); font-weight: 800; font-size: 15px; flex: none; }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn.accent { background: var(--plum); color: var(--white); }
.btn.big { padding: 15px 22px; font-size: 18px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* HOME */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.who h2 { font-size: 30px; margin-top: 2px; }
.lvl-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.lvl-badge { font-family: var(--display); background: var(--sun); color: #2A1C00; border-radius: 10px; padding: 4px 10px; font-size: 15px; white-space: nowrap; }
.xpbar { flex: 1; height: 12px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
.xp-note { font-size: 14px; color: var(--muted); margin-top: 6px; }
.suggest { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--surface-2); display: grid; gap: 10px; justify-items: start; }
.suggest strong { font-family: var(--display); font-weight: 400; font-size: 20px; }
.pl-list { display: grid; gap: 8px; margin-top: 14px; }
.pl { display: flex; align-items: center; gap: 12px; text-align: start; width: 100%; background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 17px; }
.pl .av { width: 36px; height: 36px; font-size: 18px; }
.pl small { margin-inline-start: auto; font-weight: 500; color: var(--muted); font-size: 13px; }
.add-form { margin-top: 14px; display: grid; gap: 6px; }
.add-form label { font-weight: 700; font-size: 14px; color: var(--muted); }
.add-form .row input { flex: 1; min-width: 0; }
input[type="text"] { font: inherit; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink); }

.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.board-head h3 { font-size: 22px; }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.ptile { display: grid; gap: 6px; justify-items: center; padding: 12px 8px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface-2); transition: transform .12s, border-color .12s; }
.ptile:hover { transform: translateY(-2px); border-color: var(--ink); }
.ptile b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: .04em; }
.ptile .bar { width: 100%; height: 8px; border-radius: 99px; background: var(--u); overflow: hidden; }
.ptile .bar i { display: block; height: 100%; border-radius: 99px; }
.ptile small { font-size: 12.5px; color: var(--muted); font-weight: 500; }

.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; gap: 10px; flex-wrap: wrap; }
.section-h h3 { font-size: 24px; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 820px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.mode { text-align: start; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 14px; align-items: start; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
.mode:hover { transform: translateY(-2px); border-color: var(--ink); }
.mode .glyph { grid-row: span 2; width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-size: 26px; color: #2A2238; }
.mode h4 { font-size: 21px; }
.mode p { font-size: 14.5px; color: var(--muted); line-height: 1.45; }

/* PLAY (shared) */
.play { max-width: 600px; margin: 0 auto; display: grid; gap: 14px; }
.play-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
.hud { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.hot { background: var(--sun); border-color: var(--sun); color: #2A1C00; }
.prompt { text-align: center; color: var(--muted); font-weight: 500; }
.qcard { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 26px 18px; text-align: center; box-shadow: var(--shadow); display: grid; gap: 14px; justify-items: center; }
.qcard.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.clue { font-size: 18px; color: var(--muted); max-width: 30ch; }
.clue .blank { display: inline-block; min-width: 3.5em; border-bottom: 3px dotted var(--muted); }
.word { font: 400 clamp(48px, 13vw, 76px)/1.15 var(--display); }
.slot { display: inline-block; min-width: .9em; padding-inline: .06em; border-radius: 12px; border: 3px dashed var(--plum); color: var(--plum); line-height: 1.1; }
.slot.ok { border-style: solid; border-color: var(--good); color: var(--good); }
.slot.no { border-style: solid; border-color: var(--bad); color: var(--bad); }
.choices { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 12px; }
.choice { height: 96px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); font: 400 48px var(--display); box-shadow: var(--shadow); }
.choice:hover { border-color: var(--ink); }
.choice:active { transform: translateY(2px); box-shadow: none; }
.choice .k { display: block; font: 700 12px var(--body); color: var(--muted); margin-top: -6px; }
.choice.ok { background: var(--good); border-color: var(--good); color: var(--white); }
.choice.no { background: var(--bad); border-color: var(--bad); color: var(--white); }
.keys-hint { text-align: center; color: var(--muted); font-size: 13px; }

.feedback { border-radius: 18px; padding: 16px; display: grid; gap: 10px; background: var(--surface); border: 3px solid var(--coral); }
.feedback .big { font: 400 30px var(--display); }
.feedback .big em { font-style: normal; color: var(--good); }
.feedback .tip { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.feedback.good { border-color: var(--good); }

/* find the mistake */
.sentence { display: flex; flex-wrap: wrap; gap: 8px 6px; justify-content: center; font: 400 clamp(26px, 6.5vw, 36px)/1.3 var(--display); }
.tok { border: 2px solid transparent; background: var(--surface-2); border-radius: 12px; padding: 4px 10px; font: inherit; }
.tok:hover { border-color: var(--ink); }
.tok.miss { border-color: var(--bad); animation: shake .4s; }
.tok.target { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.tok.fixed { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
.tok:disabled { cursor: default; }
.wrong-letter { color: var(--bad); text-decoration: underline wavy var(--bad); text-underline-offset: 6px; }
.right-letter { color: var(--good); }

/* root families */
.families { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fam { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 10px; display: grid; gap: 2px; justify-items: center; box-shadow: var(--shadow); }
.fam:hover { border-color: var(--ink); }
.fam b { font: 400 34px var(--display); letter-spacing: .02em; }
.fam small { color: var(--muted); font-size: 15px; }
.fam.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.fam.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }

/* results */
.results { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; text-align: center; }
.results h2 { font-size: clamp(34px, 8vw, 48px); }
.results .sub { color: var(--muted); font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { display: block; font: 400 30px var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; font-weight: 700; color: var(--muted); }
.missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.missed span { background: var(--surface); border: 2px solid var(--coral); border-radius: 10px; padding: 4px 12px; font: 400 22px var(--display); }
.res-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(20,12,30,.55); display: grid; place-items: end center; z-index: 20; padding: 16px; }
@media (min-width: 640px) { .scrim { place-items: center; } }
.sheet { width: min(560px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: var(--surface); border-radius: 20px; padding: 20px; display: grid; gap: 18px; border: 2px solid var(--line); }
.sheet h3 { font-size: 26px; }
.grp { display: grid; gap: 8px; }
.lab { font-weight: 700; font-size: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { min-width: 64px; height: 46px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); font: 400 22px var(--display); }
.tchip.sm { height: 36px; min-width: auto; font: 700 14px var(--body); }
.tchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 700; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" data-action="home" aria-label="בלש האיות, מסך הבית">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="20" r="13" fill="var(--sun)" stroke="var(--ink)" stroke-width="3.5"/><circle cx="16" cy="16" r="4" fill="#fff" opacity=".7"/><path d="M30 30l11 11" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/></svg>
      בלש האיות
    </button>
    <div class="top-r">
      <button class="chip-btn icon" id="sound-btn" data-action="sound"></button>
      <button class="chip-btn" id="player-chip" data-action="switch" hidden></button>
    </div>
  </header>

  <main>
    <section id="s-home">
      <div class="home-grid">
        <div class="card who" id="who"></div>
        <div class="card">
          <div class="board-head"><h3>האותיות המבלבלות</h3><span class="eyebrow">לחיצה על זוג מתחילה תרגול שלו</span></div>
          <div class="pairs" id="board"></div>
        </div>
      </div>
      <div class="section-h"><h3>בחירת משחק</h3></div>
      <div class="modes" id="modes"></div>
    </section>

    <section id="s-pick" hidden>
      <div class="play">
        <div class="play-top"><button class="back" data-action="home">✕ יציאה</button><div class="hud" id="pick-hud"></div></div>
        <p class="prompt">איזו אות חסרה?</p>
        <div class="qcard" id="pick-card"></div>
        <div class="choices" id="pick-choices"></div>
        <div class="feedback" id="pick-fb" hidden></div>
        <p class="keys-hint">אפשר גם להקיש 1 או 2, או את האות עצמה במקלדת.</p>
      </div>
    </section>

    <section id="s-find" hidden>
      <div class="play">
        <div class="play-top"><button class="back" data-action="home">✕ יציאה</button><div class="hud" id="find-hud"></div></div>
        <p class="prompt" id="find-prompt"></p>
        <div class="qcard" id="find-card"></div>
        <div id="find-extra"></div>
        <div class="feedback" id="find-fb" hidden></div>
      </div>
    </section>

    <section id="s-root" hidden>
      <div class="play">
        <div class="play-top"><button class="back" data-action="home">✕ יציאה</button><div class="hud" id="root-hud"></div></div>
        <p class="prompt">לאיזו משפחה המילה שייכת? השורש מגלה איך כותבים.</p>
        <div class="qcard" id="root-card"></div>
        <div class="families" id="root-fams"></div>
        <div class="feedback" id="root-fb" hidden></div>
        <p class="keys-hint">אפשר גם להקיש 1 או 2 במקלדת.</p>
      </div>
    </section>

    <section id="s-results" hidden><div class="results" id="results"></div></section>
  </main>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<canvas id="confetti"></canvas>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = n => Math.floor(Math.random() * n);

const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

ר_אש|שמתי כובע על ה___ כי קר בחוץ.
_אש|ישבנו מול ה___ של המדורה.` },
  { id: 'חכ', l: ['ח', 'כ'], label: 'ח / כ',
    tip: 'כ בלי דגש נשמעת בדיוק כמו ח. בסוף מילה זו ך סופית או ח. מילה מאותה משפחה עוזרת: מלך ← מלכה, ארוך ← ארוכה.',
    words: `_חתול

/* ---------- EVENTS ---------- */

  const a = el.dataset.action, p = P();
  const needPlayer = () => { if (p) return false; pickerOpen = true; renderHome(); const n = $('#new-name'); n && n.focus(); toast('קודם להוסיף שם'); return true; };
  switch (a) {

    case 'pick-player': DB.current = el.dataset.id; pickerOpen = false; save(); renderHome(); break;

    case 'set-all': S.pairs = PAIRS.map(x => x.id); renderSetup(); break;
    case 'set-none': S.pairs = []; renderSetup(); break;
    case 'set-len': S.len = +el.dataset.v; renderSetup(); break;
    case 'close-sheet': closeSheet(); break;
    case 'go': { if (!S.pairs.length) break; if (S.mode !== 'root') { p.lastPairs = S.pairs; save(); } const s = S; closeSheet(); START[s.mode]({ pairs: s.pairs, len: s.len }); break; }
    case 'choose': choosePick(+el.dataset.i); break;
    case 'tok': tapToken(+el.dataset.k); break;
    case 'fix': fixLetter(+el.dataset.i); break;
    case 'no-mistake': noMistake(); break;
    case 'fam': chooseFam(+el.dataset.i); break;
    case 'next': if (!G) break; ({ pick: nextPick, find: nextFind, root: nextRoot })[G.mode](); break;
    case 'again': if (lastRun) START[lastRun.mode](lastRun.opts); else goHome(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'add-form') return;
  e.preventDefault();
  const name = $('#new-name').value.trim().slice(0, 16);
  if (!name) { $('#new-name').focus(); return; }
  const id = 'p' + Date.now().toString(36);
  DB.players[id] = newPlayer(name); DB.order.push(id); DB.current = id; pickerOpen = false; save();
  renderHome(); toast(`שלום, ${name}!`);
});
// physical key → Hebrew letter, so typing works even when the computer is set to English
const KEYMAP = { KeyE: 'ק', KeyT: 'א', KeyY: 'ט', KeyU: 'ו', KeyA: 'ש', KeyF: 'כ', KeyG: 'ע', KeyJ: 'ח', KeyL: 'ך', KeyX: 'ס', KeyC: 'ב', KeyV: 'ה', Comma: 'ת' };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#scrim').hidden) { closeSheet(); return; }
  if (!G || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  const fb = $(`#${G.mode}-fb`);
  if (e.key === 'Enter') { if (fb && !fb.hidden) { e.preventDefault(); fb.querySelector('button').click(); } return; }
  const n = /^[1-3]$/.test(e.key) ? +e.key - 1 : -1;
  if (G.mode === 'pick') {
    const letter = HEB.test(e.key) ? e.key : KEYMAP[e.code];
    const i = n >= 0 && n < 2 ? n : letter ? G.choices.findIndex(c => base(c[0]) === base(letter)) : -1;
    if (i >= 0) { e.preventDefault(); choosePick(i); }
  } else if (G.mode === 'root' && n >= 0 && n < 2) { e.preventDefault(); chooseFam(n); }
  else if (G.mode === 'find' && G.step === 'fix' && n >= 0) { e.preventDefault(); fixLetter(n); }
});

renderHome();
show('home');
})();
</script>
