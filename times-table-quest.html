<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Times Table Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: one app column; home = player card + 12×12 mastery board + a path of six play modes. Game screens are a single centered column with a keypad. */
:root {
  --bg: #E7F1EE;
  --surface: #FFFFFF;
  --surface-2: #F2F8F6;
  --ink: #17213B;
  --muted: #56667C;
  --line: #CADDD7;
  --coral: #EF5146;
  --sun: #FFB21E;
  --teal: #0F978C;
  --violet: #6A4AEE;
  --good: #198F52;
  --bad: #D3333B;
  --white: #FFFFFF;
  --on-accent: #FFFFFF;
  --u: #DCE7E4;   /* unseen */
  --m1: #F9C9C3;  /* shaky */
  --m2: #FFDA8A;  /* learning */
  --m3: #D2EA9B;  /* getting there */
  --m4: #82D5A6;  /* strong */
  --m5: #1E9A5C;  /* mastered */
  --m5-ink: #FFFFFF;
  --shadow: 0 2px 0 rgba(23,33,59,.12);
  --display: "Bricolage Grotesque", "Rubik", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Rubik", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1526; --surface: #18213A; --surface-2: #1F2A47; --ink: #EDF2FA; --muted: #9DACC3; --line: #2B3858;
    --coral: #FF6C60; --sun: #FFC14A; --teal: #2EC0B2; --violet: #9C86FF; --good: #39C27E; --bad: #FF6870;
    --white: #FFFFFF; --on-accent: #0E1526;
    --u: #222E4C; --m1: #6E2E38; --m2: #7C5C1C; --m3: #4F6E2C; --m4: #227B57; --m5: #32C27C; --m5-ink: #0E1526;
    --shadow: 0 2px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1526; --surface: #18213A; --surface-2: #1F2A47; --ink: #EDF2FA; --muted: #9DACC3; --line: #2B3858;
  --coral: #FF6C60; --sun: #FFC14A; --teal: #2EC0B2; --violet: #9C86FF; --good: #39C27E; --bad: #FF6870;
  --white: #FFFFFF; --on-accent: #0E1526;
  --u: #222E4C; --m1: #6E2E38; --m2: #7C5C1C; --m3: #4F6E2C; --m4: #227B57; --m5: #32C27C; --m5-ink: #0E1526;
  --shadow: 0 2px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }

.app { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; background: none; border: 0; padding: 0; }
.brand .mark { width: 38px; height: 38px; border-radius: 10px; background: var(--ink); color: var(--sun); display: grid; place-items: center; font-size: 24px; transform: rotate(-6deg); }
.top-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.top-r .seg button { padding: 5px 10px; font-size: 13px; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding-block: 5px; padding-inline: 5px 12px; font-weight: 700; font-size: 14px; }
.chip-btn.icon { padding: 7px 12px; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); font-weight: 800; font-family: var(--display); font-size: 15px; flex: none; }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); transition: transform .08s; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn.accent { background: var(--violet); color: var(--white); }
.btn.big { padding: 15px 22px; font-size: 17px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* HOME */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.who h2 { font-size: 30px; font-weight: 800; }
.who .lvl-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.lvl-badge { font-family: var(--display); font-weight: 800; background: var(--sun); color: #2A1C00; border-radius: 10px; padding: 4px 10px; font-size: 14px; white-space: nowrap; }
.xpbar { flex: 1; height: 12px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
.xp-note { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.suggest { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--surface-2); display: grid; gap: 10px; }
.suggest strong { font-family: var(--display); font-size: 19px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pl-list { display: grid; gap: 8px; margin-top: 14px; }
.pl { display: flex; align-items: center; gap: 12px; text-align: start; width: 100%; background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 800; font-size: 17px; }
.pl .av { width: 36px; height: 36px; font-size: 18px; }
.pl small { margin-inline-start: auto; font-weight: 700; color: var(--muted); font-size: 13px; }
.add-form { margin-top: 14px; display: grid; gap: 6px; }
.add-form label { font-weight: 700; font-size: 14px; color: var(--muted); }
.add-form .row input { flex: 1; min-width: 0; }
input[type="text"] { font: inherit; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink); }

.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.board-head h3 { font-size: 20px; }
.board-count { font-family: var(--display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.board-wrap { overflow-x: auto; }
.mg { display: grid; grid-template-columns: repeat(13, minmax(24px, 1fr)); gap: 3px; min-width: 330px; }
.mg > * { aspect-ratio: 1; border: 0; border-radius: 6px; display: grid; place-items: center; font-size: clamp(9px, 1.5vw, 13px); font-weight: 800; font-variant-numeric: tabular-nums; padding: 0; }
.mh { background: transparent; color: var(--muted); font-family: var(--display); font-size: clamp(11px, 1.8vw, 15px) !important; }
.mh.row-h:hover { color: var(--violet); }
.mc { background: var(--u); color: var(--muted); transition: transform .1s; }
.mc:hover { transform: scale(1.12); position: relative; z-index: 1; }
.mc.l1 { background: var(--m1); color: var(--ink); }
.mc.l2 { background: var(--m2); color: var(--ink); }
.mc.l3 { background: var(--m3); color: var(--ink); }
.mc.l4 { background: var(--m4); color: var(--ink); }
.mc.l5 { background: var(--m5); color: var(--m5-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--muted); font-weight: 700; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; gap: 10px; flex-wrap: wrap; }
.section-h h3 { font-size: 22px; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 820px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.mode { text-align: start; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 14px; align-items: start; transition: transform .12s, border-color .12s; box-shadow: var(--shadow); }
.mode:hover { transform: translateY(-2px); border-color: var(--ink); }
.mode .glyph { grid-row: span 3; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; }
.mode .glyph svg { width: 30px; height: 30px; }
.mode .ph { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mode h4 { font-size: 19px; font-weight: 800; }
.mode p { font-size: 14px; color: var(--muted); line-height: 1.4; }
.mode .best { font-size: 12px; font-weight: 800; color: var(--ink); margin-top: 4px; font-variant-numeric: tabular-nums; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); }
.badge .medal { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--sun); color: #2A1C00; font-family: var(--display); font-weight: 800; }
.badge.locked { opacity: .5; }
.badge.locked .medal { background: var(--u); color: var(--muted); }
.badge b { display: block; font-size: 13px; line-height: 1.2; }
.badge small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; }

/* SUB-SCREEN HEADERS */
.sub-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.sub-top h2 { font-size: 26px; font-weight: 800; }
.back { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 800; font-size: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { min-width: 44px; height: 44px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
.tchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tchip.sm { height: 34px; min-width: auto; font-size: 13px; font-family: var(--body); }

/* STUDY */
.study-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; margin-top: 16px; align-items: start; }
@media (max-width: 760px) { .study-body { grid-template-columns: minmax(0, 1fr); } }
.tbl-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.tbl-head h3 { font-size: 26px; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--violet); }
.rows { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.rows button { width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; border: 0; border-radius: 10px; padding: 7px 12px; background: var(--surface-2); font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; text-align: start; }
.rows button.sel { background: var(--violet); color: var(--white); }
.rows .ans { min-width: 52px; text-align: end; font-weight: 800; }
.rows .ans.hid { color: transparent; background: var(--line); border-radius: 6px; }
.rows button.sel .ans.hid { background: rgba(255,255,255,.35); }
.side { display: grid; gap: 12px; }
.side h4 { font-size: 13px; font-family: var(--body); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.trick p { font-size: 17px; line-height: 1.5; }
.skip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.skip-row span { min-width: 40px; text-align: center; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; transition: background .15s, transform .15s; }
.skip-row span.on { background: var(--sun); color: #2A1C00; transform: scale(1.12); }
.viz-title { font-family: var(--display); font-size: 24px; font-weight: 800; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.dots { display: grid; gap: 4px; width: max-content; max-width: 100%; }
.dots .dr { display: flex; gap: 4px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--teal); display: block; }
.dots i.g5 { margin-inline-start: 6px; }
.dots i.b { background: var(--coral); }
.break { margin-top: 10px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.break b { color: var(--ink); }

/* PLAY */
.play { max-width: 540px; margin: 0 auto; display: grid; gap: 14px; }
.play-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hud { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.hot { background: var(--sun); border-color: var(--sun); color: #2A1C00; }
.timebar { height: 10px; border-radius: 99px; background: var(--surface); border: 2px solid var(--line); overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--teal); transform-origin: left; }
[dir="rtl"] .timebar i { transform-origin: right; }
.timebar.low i { background: var(--coral); }
.boss-zone { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 16px; position: relative; overflow: hidden; }
.boss-zone .bname { font-family: var(--display); font-weight: 800; font-size: 20px; }
.boss-zone .btitle { font-size: 13px; color: var(--muted); }
.hp { height: 14px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--line); overflow: hidden; margin-top: 8px; }
.hp i { display: block; height: 100%; background: var(--coral); transition: width .3s; }
.hearts { display: flex; gap: 4px; margin-top: 8px; }
.hearts svg { width: 22px; height: 22px; }
.boss-svg { display: block; }
.boss-svg.hit { animation: hit .35s; }
.boss-svg.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes hit { 0%,100% { transform: none; filter: none; } 25% { transform: translateX(-8px) rotate(-6deg); filter: brightness(1.8); } 60% { transform: translateX(6px) rotate(4deg); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.dmg { position: absolute; inset-inline-start: 70px; top: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--coral); animation: rise .8s forwards; pointer-events: none; }
@keyframes rise { to { transform: translateY(-30px); opacity: 0; } }

.qcard { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 26px 16px; text-align: center; position: relative; box-shadow: var(--shadow); }
.qcard.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.q { direction: ltr; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 68px); line-height: 1; display: flex; justify-content: center; align-items: center; gap: .22em; flex-wrap: wrap; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.q .op { color: var(--muted); font-weight: 600; }
.slot { min-width: 1.9em; padding: .08em .18em; border-radius: 14px; border: 3px dashed var(--line); color: var(--violet); display: inline-block; min-height: 1.15em; }
.slot.ok { border-style: solid; border-color: var(--good); color: var(--good); }
.slot.no { border-style: solid; border-color: var(--bad); color: var(--bad); }
.qsub { margin-top: 12px; color: var(--muted); font-weight: 700; font-size: 14px; min-height: 21px; }
.pop { position: absolute; inset-inline-end: 18px; top: 12px; font-family: var(--display); font-weight: 800; color: var(--good); font-size: 20px; animation: rise .7s forwards; }

.pad { direction: ltr; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad button { height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 26px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.pad button:active { transform: translateY(2px); box-shadow: none; }
.pad .go { background: var(--violet); border-color: var(--violet); color: var(--white); font-size: 18px; }
.pad .del { font-size: 18px; color: var(--muted); }
.keys-hint { text-align: center; color: var(--muted); font-size: 13px; }

.explain { background: var(--surface); border: 3px solid var(--coral); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.explain .big { font-family: var(--display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; }
.explain .big em { font-style: normal; color: var(--good); }
.explain .tip { font-size: 15px; line-height: 1.5; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.explain .dots-wrap { overflow-x: auto; }

/* MATCH */
/* width:100% matters: as a grid item with auto margins it would otherwise shrink to its (empty) content and the cards vanish */
.match-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 540px; margin: 0 auto; }
.mcard { aspect-ratio: 3 / 4; border-radius: 14px; border: 0; padding: 0; perspective: 600px; background: transparent; }
.mcard .in { display: block; position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.open .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .f, .mcard .b { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }
.mcard .f { background: var(--violet); color: var(--white); font-size: 28px; background-image: radial-gradient(circle at 30% 30%, rgba(255,255,255,.18) 0 18%, transparent 19%); }
.mcard .b { transform: rotateY(180deg); background: var(--surface); border: 2px solid var(--line); font-size: clamp(18px, 5vw, 28px); }
.mcard .b.ans { color: var(--teal); font-size: clamp(24px, 7vw, 38px); }
.mcard.done .b { background: var(--m4); border-color: var(--m4); color: var(--ink); }
.mcard.wrong .b { border-color: var(--coral); }

/* RESULTS */
.results { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; text-align: center; }
.results h2 { font-size: clamp(32px, 8vw, 46px); font-weight: 800; }
.results .sub { color: var(--muted); font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.missed span { background: var(--surface); border: 2px solid var(--coral); border-radius: 10px; padding: 5px 10px; font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }
.res-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* SHEET */
.scrim { position: fixed; inset: 0; background: rgba(10,14,28,.55); display: grid; place-items: end center; z-index: 20; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .scrim { place-items: center; } }

/* ---------- facts & mastery ---------- */
const fk = (a, b) => a <= b ? a + 'x' + b : b + 'x' + a;
const fact = (p, a, b) => (p && p.facts[fk(a, b)]) || null;
function lvl(p, a, b) { const f = fact(p, a, b); return f ? f.l : -1; } // -1 = never tried
function strongCount(p) { let n = 0; for (let a = 1; a <= MAXT(); a++) for (let b = a; b <= MAXT(); b++) if (lvl(p, a, b) >= 4) n++; return n; }
function tableStrong(p, t) { return TABLES().every(b => lvl(p, t, b) >= 4); }
function tableScore(p, t) { let s = 0; for (const b of TABLES()) s += Math.max(0, lvl(p, t, b)); return s / MAXT(); }
function weakestTable(p) {
  let best = 7, low = 99;
  for (const t of fitTables([2,3,4,5,6,7,8,9,11,12])) { const s = tableScore(p, t) + (t === 7 || t === 8 ? -0.01 : 0); if (s < low) { low = s; best = t; } }
  return best;
}
const lvlOf = xp => 1 + Math.floor(Math.sqrt(xp / 60));
const xpFor = l => 60 * (l - 1) * (l - 1);

function record(a, b, ok, ms) {
  const p = P(); if (!p) return;
  const k = fk(a, b);
  const f = p.facts[k] || (p.facts[k] = { l: 0, c: 0, w: 0 });
  p.answered++;
  if (ok) {
    f.c++; p.correct++;
    if (ms < 4500) f.l = Math.min(5, f.l + 1);
    else if (f.l < 2) f.l++;
    p.xp += 10;
  } else {
    f.w++; f.l = Math.max(0, f.l - 2);
  }
  save();
}

const HARD = [7, 8, 6, 12, 9, 4, 3, 11, 5, 2, 10, 1];
function breakdown(a, b) {
  // t = the harder table, n = the number we split
  const t = HARD.indexOf(a) <= HARD.indexOf(b) ? a : b;
  const n = t === a ? b : a;
  const P2 = t * n, he = isHe();
  if (n === 1 || n === 10 || t === 1 || t === 10) return '';
  if (n === 2) return he ? `פי 2: <b>${m(`${t} + ${t} = ${P2}`)}</b>` : `Double ${t}: <b>${t} + ${t} = ${P2}</b>`;
  if (n === 3) return he ? `${m(`${t} × 2 = ${t*2}`)}, ועוד ${t} אחד ← <b>${m(`${t*2} + ${t} = ${P2}`)}</b>` : `${t} × 2 = ${t*2}, plus one more ${t} → <b>${t*2} + ${t} = ${P2}</b>`;
  if (n === 4) return he ? `להכפיל את ${t} פי 2 פעמיים: ${m(`${t} → ${t*2} → <b>${P2}</b>`)}` : `Double ${t} twice: ${t} → ${t*2} → <b>${P2}</b>`;
  if (n === 5) return he ? `${m(`${t} × 10 = ${t*10}`)}, והחצי של זה הוא <b>${P2}</b>` : `${t} × 10 = ${t*10}, half of that is <b>${P2}</b>`;
  if (n === 9) return he ? `${m(`${t} × 10 = ${t*10}`)}, להוריד ${t} אחד ← <b>${m(`${t*10} − ${t} = ${P2}`)}</b>` : `${t} × 10 = ${t*10}, take away one ${t} → <b>${t*10} − ${t} = ${P2}</b>`;
  if (n === 11 || n === 12) return he ? `${m(`${t} × 10 = ${t*10}`)}, ועוד ${m(`${t} × ${n-10} = ${t*(n-10)}`)} ← <b>${P2}</b>` : `${t} × 10 = ${t*10}, plus ${t} × ${n-10} = ${t*(n-10)} → <b>${P2}</b>`;
  return he ? `${m(`${t} × 5 = ${t*5}`)}, ועוד ${m(`${t} × ${n-5} = ${t*(n-5)}`)} ← <b>${m(`${t*5} + ${t*(n-5)} = ${P2}`)}</b>`
    : `${t} × 5 = ${t*5}, plus ${t} × ${n-5} = ${t*(n-5)} → <b>${t*5} + ${t*(n-5)} = ${P2}</b>`;
}
function dotsHTML(a, b) {
  const rows = Math.min(a, b), cols = Math.max(a, b);

  for (let r = 0; r < rows; r++) {
    h += '<div class="dr">';

    h += '</div>';
  }
  return h;
}

let AC = null;
function beep(f, d = .12, type = 'sine', vol = .08, delay = 0) {
  if (!DB.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .03);
  } catch (e) {}
}

/* ---------- QUIZ ENGINE (training, weak spots, lightning, boss) ---------- */
let G = null, raf = null;
function stopLoop() { if (raf) cancelAnimationFrame(raf); raf = null; }

function weakPool(p) {
  const all = [];
  for (let a = 2; a <= MAXT(); a++) for (let b = a; b <= MAXT(); b++) {
    if (a === 10 || b === 10) continue;
    const f = fact(p, a, b);
    const score = f ? f.l * 10 - f.w * 3 + Math.min(f.c, 5) : 25 - (HARD.indexOf(a) < 5 && HARD.indexOf(b) < 5 ? 8 : 0);
    all.push({ a, b, score: score + Math.random() * 2 });
  }
  return all.sort((x, y) => x.score - y.score).slice(0, 12).map(({ a, b }) => ({ a, b }));
}

function startGame(mode, opts) {
  const p = P();
  // the range may have changed since these options were chosen
  let tables = fitTables(opts.tables || []), pool = opts.pool ? opts.pool.filter(inRange) : null;
  if (opts.pool && !pool.length) pool = weakPool(p);
  if (!pool && !tables.length) tables = [2, 3, 4, 5];
  G = { mode, tables, pool, kinds: opts.kinds && opts.kinds.length ? opts.kinds : ['mul'], len: opts.len || 20,
    boss: opts.boss || null, n: 0, right: 0, wrong: 0, streak: 0, bestStreak: 0, score: 0, xp0: p.xp,
    missed: [], review: [], input: '', lock: false, lastKey: null, hearts: 3, hp: opts.boss ? opts.boss.hp : 0, opts };
  if (mode === 'sprint') G.end = performance.now() + 60000;
  show('play');
  $('#explain').hidden = true;
  $('#pad').hidden = false;
  $('#timebar').hidden = !(mode === 'sprint' || mode === 'boss');
  const bz = $('#boss-zone');
  bz.hidden = mode !== 'boss';
  if (mode === 'boss') renderBoss();
  nextQ();
  stopLoop(); raf = requestAnimationFrame(loop);
}
function renderBoss(cls = 'bob') {
  const b = G.boss;
  $('#boss-zone').innerHTML = `${bossSVG(b, 84, cls)}<div><div class="bname">${bossName(b)}</div><div class="btitle">${bossTitle(b)}</div><div class="hp" aria-label="${t('bossHealth')}"><i style="width:${G.hp / b.hp * 100}%"></i></div><div class="hearts" aria-label="${t('heartsLeft', G.hearts)}">${[0,1,2].map(i => HEART(i < G.hearts)).join('')}</div></div>`;
}
function renderHud() {
  let h = '';
  if (G.mode === 'train' || G.mode === 'rescue') h += `<span class="pill">${m(`${Math.min(G.n, G.len)} / ${G.len}`)}</span>`;
  if (G.mode === 'sprint') h += `<span class="pill secs">${t('secs', G.secs ?? 60)}</span><span class="pill">${t('pts', G.score)}</span><span class="pill ${mult() > 1 ? 'hot' : ''}">×${mult()}</span>`;
  h += `<span class="pill ${G.streak >= 5 ? 'hot' : ''}">${t('streak', G.streak)}</span>`;
  $('#hud').innerHTML = h;
}
const mult = () => Math.min(4, 1 + Math.floor(G.streak / 5));

function pickFact() {
  const p = P();
  let cands;
  if (G.pool) cands = G.pool.map(f => ({ ...f, w: 1 }));
  else {
    cands = [];
    for (const tb of G.tables) for (const n of TABLES()) {
      const l = lvl(p, tb, n);
      let w = l < 0 ? 5 : 6 - l;
      if (tb === 1 || n === 1 || tb === 10 || n === 10) w *= .35;
      cands.push({ a: tb, b: n, w });
    }
  }
  const pool = cands.filter(c => fk(c.a, c.b) !== G.lastKey);
  const list = pool.length ? pool : cands;
  let tot = list.reduce((s, c) => s + c.w, 0), r = Math.random() * tot;
  for (const c of list) { r -= c.w; if (r <= 0) return c; }
  return list[list.length - 1];
}
function isOver() {
  if (G.mode === 'sprint') return performance.now() >= G.end;
  if (G.mode === 'boss') return G.hp <= 0 || G.hearts <= 0;
  return (G.n >= G.len && !G.review.length) || G.n >= G.len + 6;
}
function nextQ() {
  if (!G) return;
  if (isOver()) return finish();
  G.n++;
  let f;
  const di = G.review.findIndex(r => r.due <= G.n);
  if (di >= 0) f = G.review.splice(di, 1)[0];
  else if (G.n > G.len && G.review.length) f = G.review.shift();
  else f = pickFact();
  let a = f.a, b = f.b;
  if (Math.random() < .5) [a, b] = [b, a];
  G.q = makeQ(a, b, G.kinds[rand(G.kinds.length)]);
  G.lastKey = fk(a, b);
  G.input = ''; G.lock = false; G.qStart = performance.now();
  $('#qsub').textContent = (G.mode === 'train' || G.mode === 'rescue') && G.n > G.len ? t('retry') : '';
  renderQ(); renderHud();
}
// every question is one fact a × b = c written as a chain: [x, op, y, '=', z], with null marking the blank
function makeQ(a, b, kind) {
  const c = a * b, flip = Math.random() < .5;
  const chain = {
    mul: [a, '×', b, '=', null],
    miss: flip ? [a, '×', null, '=', c] : [null, '×', b, '=', c],
    div: [c, 'div', a, '=', null],
    divmiss: flip ? [c, 'div', null, '=', b] : [null, 'div', a, '=', b]
  }[kind];
  const ans = { mul: c, miss: flip ? b : a, div: b, divmiss: flip ? a : c }[kind];
  return { a, b, kind, chain, ans };
}
const DIV = () => isHe() ? ':' : '÷';
const opSym = x => x === 'div' ? DIV() : x;
// the question written out with its answer filled in; the answer can be wrapped (e.g. in <b>)
const solved = (q, wrap = x => x) => m(q.chain.map(x => x === null ? wrap(q.ans) : opSym(x)).join(' '));
function renderQ(state = '') {
  const slot = `<span class="slot ${state}" aria-live="polite">${G.input || '&nbsp;'}</span>`;
  $('#q').innerHTML = G.q.chain.map(x => x === null ? slot : typeof x === 'number' ? `<span>${x}</span>` : `<span class="op">${opSym(x)}</span>`).join('');
}
function press(k) {
  if (!G || G.lock === 'wait') return;
  if (G.lock === 'explain') { if (k === 'enter') { $('#explain').hidden = true; $('#pad').hidden = false; nextQ(); } return; }
  if (k === 'back') G.input = G.input.slice(0, -1);
  else if (k === 'enter') { if (G.input) submit(); return; }
  else { if (G.input.length >= 3) return; G.input = (G.input + k).replace(/^0+(?=\d)/, ''); }
  renderQ();
  if (G.input === String(G.q.ans)) submit();
}
function submit() {
  const q = G.q, ok = G.input === String(q.ans), ms = performance.now() - G.qStart;
  record(q.a, q.b, ok, ms);
  const p = P();
  if (ok) {
    G.right++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    if (G.streak > p.maxStreak) { p.maxStreak = G.streak; save(); }
    if (G.streak % 5 === 0) { p.xp += 5; save(); }
    SFX.ok();
    renderQ('ok');
    const card = $('#qcard');
    let popTxt = t('xpPop');
    if (G.mode === 'sprint') { const pts = 10 * mult(); G.score += pts; popTxt = '+' + pts; }
    if (G.mode === 'boss') {
      const dmg = G.streak >= 3 ? 2 : 1;
      G.hp = Math.max(0, G.hp - dmg); SFX.hit();
      renderBoss('hit');
      const d = document.createElement('div'); d.className = 'dmg'; d.textContent = dmg > 1 ? `${t('combo')} ${m('−2')}` : m('−1');
      $('#boss-zone').appendChild(d);
      popTxt = '';
    }
    if (popTxt) { const pop = document.createElement('div'); pop.className = 'pop'; pop.textContent = m(popTxt); card.appendChild(pop); setTimeout(() => pop.remove(), 700); }
    G.lock = 'wait';
    renderHud();
    checkBadges();
    setTimeout(nextQ, G.mode === 'boss' ? 450 : 330);
  } else {
    wrongAnswer(false);
  }
}
function wrongAnswer(timeout) {
  const q = G.q;
  if (timeout) record(q.a, q.b, false, 99999);
  G.wrong++; G.streak = 0;
  if (!G.missed.some(x => fk(x.a, x.b) === fk(q.a, q.b))) G.missed.push({ a: q.a, b: q.b });
  SFX.bad();
  const card = $('#qcard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  renderHud();
  if (G.mode === 'train' || G.mode === 'rescue') {
    G.review.push({ a: q.a, b: q.b, due: G.n + 3 });
    G.lock = 'explain';
    renderQ('no');
    showExplain(q);
    return;
  }
  // speed modes: flash the answer, keep going
  G.input = String(q.ans); renderQ('no');
  $('#qsub').innerHTML = `${timeout ? t('outOfTime') : ''}${solved(q, x => `<b>${x}</b>`)}`;
  if (G.mode === 'boss') { G.hearts--; renderBoss(''); }
  G.lock = 'wait';
  setTimeout(nextQ, 1500);
}
function showExplain(q) {
  const br = breakdown(q.a, q.b);
  const tb = HARD.indexOf(q.a) <= HARD.indexOf(q.b) ? q.a : q.b;
  $('#explain').innerHTML = `<div class="big">${solved(q, x => `<em>${x}</em>`)}</div>
    ${q.kind !== 'mul' ? `<div class="tip">${t('because', eq(q.a, q.b))}</div>` : ''}
    <div class="dots-wrap"><div class="dots">${dotsHTML(q.a, q.b)}</div></div>
    ${br ? `<div class="tip">${br}</div>` : ''}
    <div class="tip"><b>${t('trickOf', tb)}</b> ${esc(tip(tb))}</div>
    <p style="color:var(--muted);font-size:14px">${t('comesBack')}</p>
    <button class="btn big accent" data-key="enter">${t('gotIt')}</button>`;
  $('#explain').hidden = false; $('#pad').hidden = true;
  $('#explain').querySelector('button').focus();
}
function loop(now) {
  if (!G || $('#s-play').hidden) { raf = null; return; }
  const bar = $('#timebar'), fill = bar.firstElementChild;
  if (G.mode === 'sprint') {
    const left = Math.max(0, G.end - now);
    fill.style.transform = `scaleX(${left / 60000})`;
    bar.classList.toggle('low', left < 10000);
    const secs = Math.ceil(left / 1000);
    G.secs = secs;
    const sp = $('#hud .secs'), txt = t('secs', secs); if (sp && sp.textContent !== txt) sp.textContent = txt;
    if (left <= 0 && G.lock !== 'wait') return finish();
    if (left <= 0) { G.end = 0; }
  }
  if (G.mode === 'boss' && !G.lock) {
    const lim = G.boss.time * 1000, used = now - G.qStart, left = Math.max(0, lim - used);
    fill.style.transform = `scaleX(${left / lim})`;
    bar.classList.toggle('low', left < 3000);
    if (left <= 0) wrongAnswer(true);
  }
  raf = requestAnimationFrame(loop);
}

function finish() {
  stopLoop();
  const g = G; G = null;
  const p = P();
  const total = g.right + g.wrong;
  const acc = total ? Math.round(g.right / total * 100) : 0;
  const xp = p.xp - g.xp0;
  let good = false, mk;   // mk builds the wording, so results can be re-rendered in the other language
  if (g.mode === 'sprint') {
    const prev = p.best.sprint;
    if (g.score > prev) { p.best.sprint = g.score; save(); }
    good = g.score > prev && g.score > 0;
    mk = () => ({ title: good ? t('newBestScore') : t('timeUp'), sub: good ? t('beatOld', prev) : t('bestIs', p.best.sprint),
      stats: [[t('points'), g.score], [t('correct'), g.right], [t('bestStreak'), g.bestStreak], [t('xpEarned'), xp]] });
  } else if (g.mode === 'boss') {
    const won = g.hp <= 0;
    good = won;
    if (won && !p.bosses.includes(g.boss.id)) { p.bosses.push(g.boss.id); save(); }
    const list = bossList(), idx = list.indexOf(g.boss), next = idx >= 0 ? list[idx + 1] : null;
    mk = () => ({ title: won ? t('defeated', bossName(g.boss)) : t('winsRound', bossName(g.boss)),
      sub: won ? (next ? t('unlocked', bossName(next)) : t('allBosses')) : t('trainThen', g.tables),
      stats: [[t('hits'), g.right], [t('misses'), g.wrong], [t('bestStreak'), g.bestStreak], [t('xpEarned'), xp]] });
  } else {
    good = acc >= 80;
    mk = () => ({ title: acc === 100 ? t('perfect') : acc >= 80 ? t('great') : acc >= 50 ? t('goodPractice') : t('keepGoing'),
      sub: acc >= 80 ? t('stronger') : t('missEasier'),
      stats: [[t('correct'), m(`${g.right}/${total}`)], [t('accuracy'), acc + '%'], [t('bestStreak'), g.bestStreak], [t('xpEarned'), xp]] });
  }
  const badges = checkBadges();
  showResults({ mk, missed: g.missed, badges, good, again: g.mode === 'boss' ? { mode: 'boss', i: BOSSES.indexOf(g.boss) } : { mode: g.mode, opts: g.opts } });
}

/* ---------- RESULTS ---------- */
let lastAgain = null, lastR = null, lastMissed = [];
function showResults(r, fx = true) {
  lastR = r; lastAgain = r.again;
  const p = P(), { title, sub, stats } = r.mk();
  if (fx) { if (r.good) { SFX.win(); setTimeout(confetti, 100); } else if (r.again && r.again.mode === 'boss') SFX.lose(); }
  $('#results').innerHTML = `<span class="eyebrow">${esc(p.name)} · ${t('levelN', lvlOf(p.xp))}</span><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>
    <div class="stats">${stats.map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    ${r.badges && r.badges.length ? `<div class="card"><span class="eyebrow">${t('newBadges', r.badges.length)}</span><div class="badges" style="margin-top:10px">${r.badges.map(b => badgeHTML(b)).join('')}</div></div>` : ''}
    ${r.missed && r.missed.length ? `<div class="card"><span class="eyebrow">${t('toPractice')}</span><div class="missed" style="margin-top:10px">${r.missed.map(x => `<span>${eq(x.a, x.b)}</span>`).join('')}</div></div>` : ''}
    <div class="res-actions"><button class="btn alt big" data-action="home">${t('home')}</button>${r.missed && r.missed.length ? `<button class="btn alt big" data-action="drill-missed">${t('practiceThese')}</button>` : ''}<button class="btn accent big" data-action="again">${t('playAgain')}</button></div>`;
  lastMissed = r.missed || [];
  if (fx) show('results');
}

/* ---------- MEMORY MATCH ---------- */
let M = null, mTimer = null;
const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function startMatch(tables) {
  const p = P();
  tables = fitTables(tables);
  if (!tables.length) tables = [2, 3, 4, 5];
  const cands = [];
  for (const tb of tables) for (let n = 2; n <= MAXT(); n++) cands.push({ a: tb, b: n, w: Math.random() + (6 - Math.max(0, lvl(p, tb, n))) * .3 });
  cands.sort((x, y) => y.w - x.w);
  const pairs = [], prods = new Set();
  for (const c of cands) { if (pairs.length >= 8) break; if (!prods.has(c.a * c.b) && c.a !== 1) { prods.add(c.a * c.b); pairs.push(c); } }
  for (let a = 2; pairs.length < 8 && a <= MAXT(); a++) for (let n = 2; n <= MAXT() && pairs.length < 8; n++) if (!prods.has(a * n)) { prods.add(a * n); pairs.push({ a, b: n }); }
  const cards = [];
  pairs.forEach((f, i) => { cards.push({ id: i, kind: 'q', text: m(`${f.a} × ${f.b}`) }); cards.push({ id: i, kind: 'a', text: String(f.a * f.b) }); });
  M = { cards: shuffle(cards), open: [], done: 0, moves: 0, start: performance.now(), lock: false, tables, pairs };
  show('match');
  $('#match-grid').innerHTML = M.cards.map((c, i) => `<button class="mcard" data-action="flip" data-i="${i}" aria-label="${t('card', i + 1)}"><span class="in"><span class="f">×</span><span class="b ${c.kind === 'a' ? 'ans' : ''}">${c.text}</span></span></button>`).join('');
  clearInterval(mTimer); mTimer = setInterval(matchHud, 500); matchHud();
}
function matchHud() {
  if (!M) { clearInterval(mTimer); return; }
  const s = Math.floor((performance.now() - M.start) / 1000);
  $('#match-hud').innerHTML = `<span class="pill">${t('pairs', M.done)}</span><span class="pill">${t('moves', M.moves)}</span><span class="pill">${clock(s)}</span>`;
}
function flip(i) {
  if (!M || M.lock) return;
  const els = document.querySelectorAll('.mcard'), el = els[i];
  if (el.classList.contains('open') || el.classList.contains('done')) return;
  el.classList.add('open'); SFX.flip();
  M.open.push(i);
  if (M.open.length < 2) return;
  M.moves++;
  const [x, y] = M.open;
  if (M.cards[x].id === M.cards[y].id && M.cards[x].kind !== M.cards[y].kind) {
    M.open = []; M.done++;
    setTimeout(() => { els[x].classList.add('done'); els[y].classList.add('done'); SFX.ok(); }, 250);
    const p = P(); p.xp += 5; save();
    if (M.done === 8) setTimeout(endMatch, 700);
  } else {
    M.lock = true;
    setTimeout(() => { els[x].classList.add('wrong'); els[y].classList.add('wrong'); }, 300);
    setTimeout(() => { els[x].classList.remove('open', 'wrong'); els[y].classList.remove('open', 'wrong'); M.open = []; M.lock = false; }, 1000);
  }
  matchHud();
}
function endMatch() {
  if (!M) return;
  clearInterval(mTimer);
  const mm = M; M = null;
  const p = P();
  const secs = Math.round((performance.now() - mm.start) / 1000);
  const prev = p.best.match;
  const better = prev == null || mm.moves < prev;
  if (better) { p.best.match = mm.moves; save(); }
  const badges = checkBadges();
  showResults({ mk: () => ({ title: better ? t('newRecord') : t('allPairs'), sub: better ? (prev == null ? t('firstBoard') : t('oldBestMoves', prev)) : t('bestMovesPerfect', prev),
    stats: [[t('movesL'), mm.moves], [t('time'), clock(secs)], [t('xpEarned'), 40]] }), missed: [], badges, good: true, again: { mode: 'match', opts: { tables: mm.tables } } });
}

/* ---------- EVENTS ---------- */
function startMode(mode, opts) {
  if (mode === 'match') return startMatch(opts.tables);
  startGame(mode, opts);
}
document.addEventListener('click', e => {
  const k = e.target.closest('[data-key]');
  if (k) { press(k.dataset.key); return; }
  const el = e.target.closest('[data-action]');
  if (!el) { if (e.target.id === 'scrim') closeSheet(); return; }
  const a = el.dataset.action, p = P();
  const needPlayer = () => { if (!p) { pickerOpen = true; renderHome(); const n = $('#new-name'); n && n.focus(); toast(t('addFirst')); return true; } return false; };
  switch (a) {
    case 'home': goHome(); break;
    case 'quit': goHome(); break;
    case 'sound': DB.sound = !DB.sound; save(); renderHeader(); break;
    case 'lang': DB.lang = isHe() ? 'en' : 'he'; save(); refresh(); break;
    case 'range': DB.upTo12 = el.dataset.v === '12'; save(); refresh(); break;
    case 'switch': pickerOpen = true; goHome(); break;
    case 'pick': DB.current = el.dataset.id; pickerOpen = false; save(); renderHome(); break;
    case 'study': if (needPlayer()) break; openStudy(+el.dataset.t, el.dataset.n ? +el.dataset.n : ST.n); break;
    case 'study-t': ST.t = +el.dataset.t; clearTimeout(ST.counting); ST.counting = null; renderStudy(); break;
    case 'study-n': ST.n = +el.dataset.n; renderStudy(); break;
    case 'count-along': countAlong(); break;
    case 'quiz-table': startGame('train', { tables: [ST.t], len: 12 }); break;
    case 'train-one': startGame('train', { tables: [+el.dataset.t], len: 15 }); break;
    case 'mode': {
      if (needPlayer()) break;
      const md = el.dataset.mode;
      if (md === 'study') openStudy(weakestTable(p));
      else if (md === 'rescue') startGame('rescue', { pool: weakPool(p), len: 15 });
      else if (md === 'boss') openBossSelect();
      else openSetup(md);
      break;
    }
    case 'set-t': { const x = +el.dataset.t; S.tables = S.tables.includes(x) ? S.tables.filter(y => y !== x) : [...S.tables, x].sort((u, v) => u - v); renderSetup(); break; }
    case 'set-preset': S.tables = { '2-5': [2,3,4,5], '6-9': [6,7,8,9], '11-12': [11,12], all: TABLES().slice(1), none: [] }[el.dataset.v]; renderSetup(); break;
    case 'set-kind': { const k = el.dataset.v; S.kinds = S.kinds.includes(k) ? S.kinds.filter(x => x !== k) : [...S.kinds, k]; renderSetup(); break; }
    case 'set-kinds': S.kinds = el.dataset.v === 'all' ? [...KINDS] : ['mul']; renderSetup(); break;
    case 'set-len': S.len = +el.dataset.v; renderSetup(); break;
    case 'close-sheet': closeSheet(); break;
    case 'go': {
      if (!S.tables.length) break;
      p.lastTables = S.tables; if (S.mode !== 'match') p.lastKinds = S.kinds; save();
      const s = S; closeSheet();
      startMode(s.mode, { tables: s.tables, kinds: s.kinds, len: s.len });
      break;
    }
    case 'boss': { const b = BOSSES[+el.dataset.i]; closeSheet(); startGame('boss', { tables: b.tables, boss: b }); break; }
    case 'flip': flip(+el.dataset.i); break;
    case 'again': {
      const r = lastAgain; if (!r) return goHome();
      if (r.mode === 'boss') { const b = BOSSES[r.i]; startGame('boss', { tables: b.tables, boss: b }); }
      else if (r.mode === 'rescue') startGame('rescue', { pool: weakPool(p), len: 15 });
      else startMode(r.mode, r.opts);
      break;
    }
    case 'drill-missed': startGame('train', { pool: lastMissed.map(x => ({ a: x.a, b: x.b })), len: Math.max(8, lastMissed.length * 2) }); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'add-form') return;
  e.preventDefault();
  const name = $('#new-name').value.trim().slice(0, 16);
  if (!name) { $('#new-name').focus(); return; }
  const id = 'p' + Date.now().toString(36);
  DB.players[id] = newPlayer(name); DB.order.push(id); DB.current = id; pickerOpen = false; save();
  renderHome(); toast(t('welcome', name));
});
document.addEventListener('change', e => { if (e.target.id === 'cover') { ST.cover = e.target.checked; renderStudy(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#scrim').hidden) { closeSheet(); return; }
  if ($('#s-play').hidden || !G) return;
  if (e.target.tagName === 'INPUT') return;
  if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { press('back'); e.preventDefault(); }
  else if (e.key === 'Enter') { press('enter'); e.preventDefault(); }
});

renderHome();
show('home');
})();
</script>

</body></html>
